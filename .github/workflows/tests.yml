name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: parser and calibration unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      # The beacon decode and the calibration maths import neither Home Assistant nor
      # Bluetooth, so they are testable on their own.
      - run: python -m pytest tests -q
